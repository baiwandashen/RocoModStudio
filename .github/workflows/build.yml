name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/RocoModStudio/RocoModStudio.csproj
      - name: Build
        run: dotnet build src/RocoModStudio/RocoModStudio.csproj -c Release --no-restore
      - name: Publish application
        run: dotnet publish src/RocoModStudio/RocoModStudio.csproj -c Release -o artifacts/RocoModStudio --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocoModStudio
          path: artifacts/RocoModStudio
